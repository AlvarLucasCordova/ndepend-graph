<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagramas C4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, sans-serif;
      background: #eef2f6;
      color: #182330;
    }

    #menu {
      max-width: 800px;
      margin: 40px auto;
      padding: 24px;
    }

    article {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #d5dce5;
      border-radius: 12px;
      background: white;
    }

    h2 {
      margin-top: 0;
    }

    a {
      display: inline-block;
      margin: 4px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #e5edf7;
      color: #182330;
      text-decoration: none;
    }

    a:hover {
      background: #cddfff;
    }

    body.modo-visor {
      height: 100dvh;
      overflow: hidden;
      background: white;
    }

    #visor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: white;
      cursor: grab;
      touch-action: none;
      overscroll-behavior: none;
    }

    #visor.arrastrando {
      cursor: grabbing;
    }

    #imagen {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      transform-origin: 0 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <section id="menu">
    <h1>Ejemplos C4</h1>

    <article>
      <h2>Logística</h2>
      <a href="?diagrama=1">Contexto del sistema</a>
      <a href="?diagrama=2">Contenedores</a>
    </article>

    <article>
      <h2>Universidad</h2>
      <a href="?diagrama=3">Contexto del sistema</a>
      <a href="?diagrama=4">Contenedores</a>
    </article>

    <article>
      <h2>Hospital</h2>
      <a href="?diagrama=5">Contexto del sistema</a>
      <a href="?diagrama=6">Contenedores</a>
    </article>
  </section>

  <main id="visor" hidden aria-label="Diagrama C4">
    <img id="imagen" alt="Diagrama C4" draggable="false">
  </main>

  <script>
    const diagramas = {
      "1": {
        titulo: "Logística — Contexto del sistema",
        archivo: "logistica/ContextoSistema.svg"
      },
      "2": {
        titulo: "Logística — Contenedores",
        archivo: "logistica/Paso3Completo (2).svg"
      },
      "3": {
        titulo: "Universidad — Contexto del sistema",
        archivo: "universidad/ContextoSistema (1).svg"
      },
      "4": {
        titulo: "Universidad — Contenedores",
        archivo: "universidad/Paso3Completo (1).svg"
      },
      "5": {
        titulo: "Hospital — Contexto del sistema",
        archivo: "../Hospital/ContextoSistema (2).svg"
      },
      "6": {
        titulo: "Hospital — Contenedores",
        archivo: "../Hospital/Paso3Completo (3).svg"
      }
    };

    const id = new URLSearchParams(location.search).get("diagrama");

    if (Object.hasOwn(diagramas, id)) {
      const datos = diagramas[id];
      const visor = document.getElementById("visor");
      const imagen = document.getElementById("imagen");

      document.getElementById("menu").hidden = true;
      visor.hidden = false;
      document.body.classList.add("modo-visor");
      document.title = datos.titulo;
      imagen.alt = datos.titulo;

      const ZOOM_MAXIMO = 100; 
      
      let listo = false;
      let escala = 1;
      let minimo = 1;
      let maximo = 5;
      let x = 0;
      let y = 0;
      let gesto = null;
      let anchoAnterior = 0;
      let altoAnterior = 0;

      const punteros = new Map();

      function limitar(valor, inferior, superior) {
        return Math.max(inferior, Math.min(superior, valor));
      }

      function recalcularLimites() {
        minimo = Math.min(
          visor.clientWidth / imagen.naturalWidth,
          visor.clientHeight / imagen.naturalHeight
        );

        maximo = minimo * ZOOM_MAXIMO;
      }

      function dibujar() {
        escala = limitar(escala, minimo, maximo);

        const ancho = imagen.naturalWidth * escala;
        const alto = imagen.naturalHeight * escala;
        const vw = visor.clientWidth;
        const vh = visor.clientHeight;

        x = ancho <= vw
          ? (vw - ancho) / 2
          : limitar(x, vw - ancho, 0);

        y = alto <= vh
          ? (vh - alto) / 2
          : limitar(y, vh - alto, 0);

        imagen.style.transform =
          `translate(${x}px, ${y}px) scale(${escala})`;
      }

      function ajustar() {
        if (!listo) return;

        recalcularLimites();
        escala = minimo;
        x = 0;
        y = 0;

        dibujar();
      }

      function ampliar(factor, px, py) {
        if (!listo) return;

        const nueva = limitar(escala * factor, minimo, maximo);

        if (nueva === escala) return;

        x = px - (px - x) * nueva / escala;
        y = py - (py - y) * nueva / escala;
        escala = nueva;

        dibujar();
      }

      function punto(event) {
        const rect = visor.getBoundingClientRect();

        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      function iniciarGesto() {
        const puntos = [...punteros.values()];

        if (puntos.length === 1) {
          gesto = {
            tipo: "arrastre",
            punto: puntos[0]
          };
        } else if (puntos.length >= 2) {
          const [a, b] = puntos;
          const cx = (a.x + b.x) / 2;
          const cy = (a.y + b.y) / 2;

          gesto = {
            tipo: "pellizco",
            distancia: Math.max(
              1,
              Math.hypot(b.x - a.x, b.y - a.y)
            ),
            escala,
            anclaX: (cx - x) / escala,
            anclaY: (cy - y) / escala
          };
        } else {
          gesto = null;
        }

        visor.classList.toggle(
          "arrastrando",
          puntos.length > 0
        );
      }

      imagen.onload = () => {
        if (!imagen.naturalWidth || !imagen.naturalHeight) return;

        imagen.style.width = `${imagen.naturalWidth}px`;
        imagen.style.height = `${imagen.naturalHeight}px`;

        anchoAnterior = visor.clientWidth;
        altoAnterior = visor.clientHeight;
        listo = true;

        ajustar();
      };

      imagen.onerror = () => {
        imagen.hidden = true;
        console.error("No se pudo cargar:", datos.archivo);
      };

      imagen.src = datos.archivo
        .split("/")
        .map(parte => encodeURIComponent(parte))
        .join("/");

      visor.addEventListener("wheel", event => {
        event.preventDefault();

        const p = punto(event);

        const delta = event.deltaMode === 1
          ? event.deltaY * 16
          : event.deltaMode === 2
            ? event.deltaY * visor.clientHeight
            : event.deltaY;

        ampliar(
          Math.exp(-limitar(delta, -200, 200) * 0.002),
          p.x,
          p.y
        );

        if (punteros.size) iniciarGesto();
      }, { passive: false });

      visor.addEventListener("pointerdown", event => {
        if (!listo || event.button !== 0) return;

        punteros.set(event.pointerId, punto(event));
        visor.setPointerCapture(event.pointerId);

        iniciarGesto();
      });

      visor.addEventListener("pointermove", event => {
        if (!punteros.has(event.pointerId)) return;

        const actual = punto(event);
        punteros.set(event.pointerId, actual);

        const puntos = [...punteros.values()];

        if (
          gesto?.tipo === "arrastre" &&
          puntos.length === 1
        ) {
          x += actual.x - gesto.punto.x;
          y += actual.y - gesto.punto.y;

          dibujar();
          gesto.punto = actual;
        } else if (
          gesto?.tipo === "pellizco" &&
          puntos.length >= 2
        ) {
          const [a, b] = puntos;
          const distancia = Math.hypot(
            b.x - a.x,
            b.y - a.y
          );

          escala = limitar(
            gesto.escala * distancia / gesto.distancia,
            minimo,
            maximo
          );

          x = (a.x + b.x) / 2 - gesto.anclaX * escala;
          y = (a.y + b.y) / 2 - gesto.anclaY * escala;

          dibujar();
          iniciarGesto();
        }
      });

      function soltar(event) {
        if (!punteros.delete(event.pointerId)) return;
        iniciarGesto();
      }

      visor.addEventListener("pointerup", soltar);
      visor.addEventListener("pointercancel", soltar);
      visor.addEventListener("lostpointercapture", soltar);

      new ResizeObserver(() => {
        const ancho = visor.clientWidth;
        const alto = visor.clientHeight;

        if (!listo || !ancho || !alto) return;

        if (
          ancho === anchoAnterior &&
          alto === altoAnterior
        ) return;

        const zoomRelativo = escala / minimo;
        const centroX = (anchoAnterior / 2 - x) / escala;
        const centroY = (altoAnterior / 2 - y) / escala;

        recalcularLimites();

        escala = limitar(
          minimo * zoomRelativo,
          minimo,
          maximo
        );

        x = ancho / 2 - centroX * escala;
        y = alto / 2 - centroY * escala;

        anchoAnterior = ancho;
        altoAnterior = alto;

        dibujar();

        if (punteros.size) iniciarGesto();
      }).observe(visor);
    }
  </script>
</body>
</html>
