<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagrama C4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: white;
    }

    #visor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #visor.arrastrando {
      cursor: grabbing;
    }

    #imagen {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      transform-origin: 0 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>
  <main id="visor">
    <img id="imagen" alt="Diagrama C4" draggable="false">
  </main>

  <script>
    const archivos = {
      "1": "logistica/ContextoSistema.svg",
      "2": "logistica/Paso3Completo (2).svg",
      "3": "universidad/ContextoSistema (1).svg",
      "4": "universidad/Paso3Completo (1).svg",
      "5": "../Hospital/ContextoSistema (2).svg",
      "6": "../Hospital/Paso3Completo (3).svg"
    };

    const parametro = new URLSearchParams(location.search)
      .get("diagrama");

    const id = Object.hasOwn(archivos, parametro)
      ? parametro
      : "1";

    const visor = document.getElementById("visor");
    const imagen = document.getElementById("imagen");

    let escala = 1;
    let x = 0;
    let y = 0;
    let listo = false;

    const punteros = new Map();
    let gesto = null;

    function dibujar() {
      imagen.style.transform =
        `translate(${x}px, ${y}px) scale(${escala})`;
    }

    function ajustar() {
      if (!listo) return;

      escala = Math.max(
        0.001,
        Math.min(
          visor.clientWidth / imagen.naturalWidth,
          visor.clientHeight / imagen.naturalHeight
        )
      );

      x = (visor.clientWidth - imagen.naturalWidth * escala) / 2;
      y = (visor.clientHeight - imagen.naturalHeight * escala) / 2;

      dibujar();
    }

    function ampliar(factor, px, py) {
      if (!listo) return;

      const nueva = Math.max(
        0.001,
        Math.min(50, escala * factor)
      );

      x = px - (px - x) * nueva / escala;
      y = py - (py - y) * nueva / escala;
      escala = nueva;

      dibujar();
    }

    imagen.onload = () => {
      if (!imagen.naturalWidth || !imagen.naturalHeight) return;

      imagen.style.width = `${imagen.naturalWidth}px`;
      imagen.style.height = `${imagen.naturalHeight}px`;

      listo = true;
      ajustar();
    };

    imagen.src = archivos[id]
      .split("/")
      .map(parte => encodeURIComponent(parte))
      .join("/");

    visor.addEventListener("wheel", event => {
      event.preventDefault();

      ampliar(
        Math.exp(-event.deltaY * 0.002),
        event.clientX,
        event.clientY
      );
    }, { passive: false });

    function iniciarGesto() {
      const puntos = [...punteros.values()];

      if (puntos.length === 1) {
        gesto = {
          tipo: "arrastre",
          punto: puntos[0],
          x,
          y
        };
      } else if (puntos.length >= 2) {
        const [a, b] = puntos;
        const cx = (a.x + b.x) / 2;
        const cy = (a.y + b.y) / 2;

        gesto = {
          tipo: "pellizco",
          distancia: Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)),
          escala,
          anclaX: (cx - x) / escala,
          anclaY: (cy - y) / escala
        };
      } else {
        gesto = null;
      }

      visor.classList.toggle("arrastrando", puntos.length > 0);
    }

    visor.addEventListener("pointerdown", event => {
      if (!listo || event.button !== 0) return;

      punteros.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      visor.setPointerCapture(event.pointerId);
      iniciarGesto();
    });

    visor.addEventListener("pointermove", event => {
      if (!punteros.has(event.pointerId)) return;

      punteros.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      const puntos = [...punteros.values()];

      if (gesto?.tipo === "arrastre" && puntos.length === 1) {
        x = gesto.x + puntos[0].x - gesto.punto.x;
        y = gesto.y + puntos[0].y - gesto.punto.y;
        dibujar();
      } else if (gesto?.tipo === "pellizco" && puntos.length >= 2) {
        const [a, b] = puntos;
        const distancia = Math.hypot(b.x - a.x, b.y - a.y);

        escala = Math.max(
          0.001,
          Math.min(50, gesto.escala * distancia / gesto.distancia)
        );

        x = (a.x + b.x) / 2 - gesto.anclaX * escala;
        y = (a.y + b.y) / 2 - gesto.anclaY * escala;

        dibujar();
      }
    });

    function soltar(event) {
      if (!punteros.delete(event.pointerId)) return;
      iniciarGesto();
    }

    visor.addEventListener("pointerup", soltar);
    visor.addEventListener("pointercancel", soltar);
    visor.addEventListener("lostpointercapture", soltar);

    new ResizeObserver(() => {
      if (punteros.size === 0) ajustar();
    }).observe(visor);
  </script>
</body>
</html>
